<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>部门详情 · AI-FLOWS 平台</title>
  <link rel="stylesheet" href="/ai-pipeline.css">
  <script src="/user-menu.js" defer></script>
  <style>
    /* 页面壳：无侧栏，居中内容（与设置页风格一致，少了 sidebar） */
    .page-shell{min-height:calc(100vh - 56px);}
    .main-content{max-width:960px;margin:0 auto;padding:28px 36px 80px;min-width:0;}

    .page-head{margin-bottom:24px;}
    .page-title{margin:0;font:700 24px/32px var(--font-sans);color:var(--ink);}
    .page-title em{font-style:normal;color:var(--led);}
    .page-sub{margin:6px 0 0;font:400 13px/20px var(--font-sans);color:var(--muted);}

    .stats-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:28px;}
    .stat-card{background:var(--glass-fill);border:1px solid var(--glass-line);border-radius:var(--radius-card);
      padding:16px 18px;}
    .stat-card .label{font:500 12px/18px var(--font-sans);color:var(--muted);}
    .stat-card .num{margin-top:6px;font:700 28px/34px var(--font-mono);color:var(--ink);letter-spacing:-.5px;}
    .stat-card.accent .num{color:var(--led);}

    /* 去卡片化：分区用分隔线 + 标题（与设置/团队页一致） */
    .section{padding:24px 0;border-bottom:1px solid var(--glass-line);}
    .section:first-of-type{padding-top:8px;}
    .section:last-of-type{border-bottom:none;}
    .section h2{margin:0 0 18px;font:600 15px/22px var(--font-sans);color:var(--ink-soft);
      display:flex;align-items:center;gap:8px;}
    .section h2 .count{margin-left:auto;font:400 12px/18px var(--font-sans);color:var(--muted);font-weight:400;}

    /* 部门树：每个部门一块，主管置顶，成员网格排列 */
    .dept-tree{display:flex;flex-direction:column;gap:18px;}
    .dept-card{background:var(--glass-fill);border:1px solid var(--glass-line);
      border-radius:var(--radius-card);overflow:hidden;}
    .dept-card-head{display:flex;align-items:center;gap:12px;padding:14px 18px;
      background:linear-gradient(180deg,var(--paper-2),var(--glass-fill));
      border-bottom:1px solid var(--glass-line);}
    .dept-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
      background:var(--led-soft);color:var(--led);font-size:18px;flex:none;}
    .dept-info{flex:1;min-width:0;}
    .dept-name{font:700 15px/22px var(--font-sans);color:var(--ink);}
    .dept-meta{font:400 12px/18px var(--font-sans);color:var(--muted);margin-top:2px;}
    .dept-badge{display:inline-block;padding:2px 8px;border-radius:999px;
      font:600 10px/16px var(--font-sans);letter-spacing:.3px;
      background:var(--led-soft);color:var(--led);margin-left:8px;}
    .dept-body{padding:16px 18px;}

    /* 主管行：单独突出显示 */
    .supervisor-row{display:flex;align-items:center;gap:12px;padding:12px 14px;
      background:linear-gradient(135deg,var(--led-soft),rgba(129,140,248,.04));
      border:1px solid rgba(129,140,248,.25);border-radius:10px;margin-bottom:14px;}
    .supervisor-row .avatar{width:40px;height:40px;border-radius:50%;flex:none;
      display:flex;align-items:center;justify-content:center;color:#fff;
      font:700 16px/1 var(--font-sans);box-shadow:0 2px 8px rgba(79,70,229,.25);}
    .supervisor-row .info{flex:1;min-width:0;}
    .supervisor-row .name{font:600 13px/18px var(--font-sans);color:var(--ink);}
    .supervisor-row .title{font:400 11.5px/16px var(--font-sans);color:var(--muted);}
    .supervisor-row .role{font:700 10px/16px var(--font-sans);letter-spacing:.5px;
      color:var(--led);background:rgba(255,255,255,.6);padding:2px 8px;border-radius:999px;}

    /* 成员网格 */
    .members-label{font:700 11px/16px var(--font-sans);letter-spacing:1px;text-transform:uppercase;
      color:var(--muted-2);margin-bottom:10px;}
    .member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;}
    .member-item{display:flex;align-items:center;gap:10px;padding:10px 12px;
      border:1px solid var(--glass-line);border-radius:8px;background:var(--paper);
      transition:all .12s ease;}
    .member-item:hover{background:var(--paper-2);border-color:var(--glass-line-strong);}
    .member-item .avatar{width:32px;height:32px;border-radius:50%;flex:none;
      display:flex;align-items:center;justify-content:center;color:#fff;
      font:600 13px/1 var(--font-sans);}
    .member-item .m-info{flex:1;min-width:0;}
    .member-item .m-name{font:600 12.5px/18px var(--font-sans);color:var(--ink-soft);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .member-item .m-title{font:400 11px/15px var(--font-sans);color:var(--muted);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

    @media (max-width:720px){
      .stats-row{grid-template-columns:repeat(2,minmax(0,1fr));}
      .member-grid{grid-template-columns:1fr;}
      .main-content{padding:20px 18px 60px;}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1 class="brand-title">
        <span class="tt-pipeline">AI-FLOWS</span>
        <span class="tt-sep">/</span>
        <span>部门详情</span>
      </h1>
    </div>
    <div class="top-right">
      <a class="nav-link" href="/home">首页</a>
      <a class="nav-link" href="/pipeline" target="_blank" rel="noopener">AI 管线</a>
      <a class="nav-link" href="/tickets" target="_blank" rel="noopener">工单</a>
      <a class="nav-link" href="/kb" target="_blank" rel="noopener">知识库</a>
      <a class="nav-link" href="/reviews" target="_blank" rel="noopener">代码评审</a>
      <a class="nav-link" href="/chat" target="_blank" rel="noopener">AI 对话</a>
      <a class="nav-link" href="/art" target="_blank" rel="noopener">AI 美术平台</a>
      <div class="user-menu">
        <span class="user-chip" id="userChip" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false"><span class="avatar" aria-hidden="true"></span><span id="userName">未登录</span></span>
        <div class="user-panel" id="userPanel" hidden></div>
      </div>
    </div>
  </header>

  <div class="page-shell">
    <div class="main-content">
      <div class="page-head">
        <h1 class="page-title"><em>部门详情</em></h1>
        <p class="page-sub">全部部门组织结构与成员分布</p>
      </div>

      <!-- 统计卡 -->
      <div class="stats-row" id="statsRow">
        <div class="stat-card">
          <div class="label">部门总数</div>
          <div class="num" id="statDepts">0</div>
        </div>
        <div class="stat-card accent">
          <div class="label">员工总数</div>
          <div class="num" id="statUsers">0</div>
        </div>
        <div class="stat-card">
          <div class="label">主管人数</div>
          <div class="num" id="statSupervisors">0</div>
        </div>
        <div class="stat-card">
          <div class="label">平均每部门</div>
          <div class="num" id="statAvg">0</div>
        </div>
      </div>

      <!-- 部门树 -->
      <div class="section">
        <h2>组织架构 <span class="count" id="deptCount">0 个部门</span></h2>
        <div class="dept-tree" id="deptTree"></div>
      </div>
    </div>
  </div>
</body>
</html>
