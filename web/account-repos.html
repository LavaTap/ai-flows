<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仓库管理 · AI-FLOWS 平台</title>
  <link rel="stylesheet" href="/ai-pipeline.css">
  <script src="/user-menu.js" defer></script>
  <style>
    /* 页面壳：左侧栏 + 主内容（与账号管理页一致） */
    .page-shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 56px);}
    .sidebar{position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;
      border-right:1px solid var(--glass-line);background:var(--paper-1);padding:20px 12px;box-sizing:border-box;}
    .side-title{font:700 11px/18px var(--font-sans);color:var(--muted);letter-spacing:1px;
      text-transform:uppercase;padding:0 10px 8px;}
    .side-nav{display:flex;flex-direction:column;gap:2px;}
    .side-nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;
      font:500 13px/20px var(--font-sans);color:var(--copy);text-decoration:none;transition:all 120ms ease;}
    .side-nav a:hover{background:var(--paper-2);color:var(--ink-soft);}
    .side-nav a.active{background:var(--led-soft);color:var(--led);}
    .main-content{padding:24px 36px 80px;min-width:0;}
    .breadcrumb{display:flex;align-items:center;gap:8px;font:400 12px/18px var(--font-sans);color:var(--muted);margin-bottom:16px;}
    .breadcrumb a{color:var(--muted);text-decoration:none;}
    .breadcrumb a:hover{color:var(--led);}
    .breadcrumb .sep{opacity:.5;}
    .breadcrumb .current{color:var(--ink-soft);font-weight:500;}

    /* 去卡片化：分区用分隔线 + 标题 */
    .section{padding:20px 0;border-bottom:1px solid var(--glass-line);}
    .section:first-of-type{padding-top:4px;}
    .section:last-of-type{border-bottom:none;}
    .section h2{margin:0 0 16px;font:600 14px/22px var(--font-sans);color:var(--ink-soft);}

    /* 仓库列表 */
    .repo-list{display:flex;flex-direction:column;gap:10px;}
    .repo-card{border:1px solid var(--glass-line);border-radius:12px;background:var(--paper-2);padding:14px 16px;}
    .repo-card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
    .repo-card-name{font:600 14px/22px var(--font-sans);color:var(--ink);min-width:0;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .repo-card-actions{margin-left:auto;display:flex;gap:8px;flex:none;}
    .repo-meta{display:flex;flex-direction:column;gap:6px;}
    .repo-meta .row{display:flex;align-items:center;gap:10px;}
    .repo-meta .k{font:500 12px/18px var(--font-sans);color:var(--muted);flex:none;min-width:72px;}
    .repo-meta .v{font:400 12.5px/20px var(--font-mono);color:var(--ink);min-width:0;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .repo-meta .v.link{color:var(--led);}
    .repo-meta .v.empty{color:var(--muted-2);font-family:var(--font-sans);}
    .repo-tags{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
    .repo-tag{font:500 10.5px/16px var(--font-sans);color:var(--led);background:var(--led-soft);
      border-radius:999px;padding:2px 9px;white-space:nowrap;}
    .repo-tag.muted{color:var(--muted);background:var(--paper-1);}

    /* 编辑态 */
    .repo-edit{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px;}
    .repo-edit .full{grid-column:1 / -1;}
    .repo-edit label{display:block;font:500 11px/17px var(--font-sans);color:var(--muted);margin-bottom:4px;}

    /* 表单 */
    .form-row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;max-width:520px;}
    .form-row label{font:500 12px/18px var(--font-sans);color:var(--copy);}
    input[type=text]{padding:9px 12px;border:1px solid var(--glass-line);border-radius:8px;
      background:var(--glass-fill);box-shadow:inset 0 1px 2px rgba(15,23,42,.04);
      font:400 13px/20px var(--font-mono);color:var(--ink);width:100%;box-sizing:border-box;}
    input[type=text]:focus{outline:none;border-color:var(--led);box-shadow:0 0 0 3px var(--led-soft);}
    .form-hint{font:400 11px/17px var(--font-sans);color:var(--muted-2);}
    .btn{padding:8px 16px;border-radius:8px;font:500 12px/18px var(--font-sans);cursor:pointer;
      border:1px solid var(--glass-line);background:var(--glass-fill);color:var(--ink-soft);white-space:nowrap;}
    .btn:hover{background:var(--paper-2);}
    .btn.primary{background:var(--teal);color:#fff;border-color:var(--teal);}
    .btn.primary:hover{background:#059669;}
    .btn.danger{color:var(--block);}
    .btn.danger:hover{background:rgba(173,49,77,.10);}
    .btn.sm{padding:5px 12px;font-size:11.5px;}
    .btn:disabled{opacity:.5;cursor:not-allowed;}
    .form-actions{display:flex;align-items:center;gap:10px;}
    .form-msg{font:400 12px/18px var(--font-sans);}
    .form-msg.ok{color:var(--teal);}
    .form-msg.err{color:var(--block);}
    .empty-tip{font:400 13px/20px var(--font-sans);color:var(--muted);padding:10px 0;}
  </style>
</head>
<body>
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <h1 class="brand-title">
        <span class="tt-pipeline">AI-FLOWS</span>
        <span class="tt-sep">/</span>
        <span>仓库管理</span>
      </h1>
    </div>
    <div class="top-right">
      <a href="/home" class="nav-link">首页</a>
      <a href="/pipeline" class="nav-link" target="_blank" rel="noopener">AI 管线</a>
      <a href="/tickets" class="nav-link" target="_blank" rel="noopener">工单</a>
      <a href="/kb" class="nav-link" target="_blank" rel="noopener">知识库</a>
      <a href="/github-audit" class="nav-link">GitHub</a>
      <a href="/team" id="teamLink" class="nav-link" style="display:none;">团队管理</a>
      <a href="/chat" class="nav-link" target="_blank" rel="noopener">AI 对话</a>
      <div class="user-menu">
        <span class="user-chip" id="userChip" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false"><span class="avatar" aria-hidden="true"></span><span id="userName">未登录</span></span>
        <div class="user-panel" id="userPanel" hidden>
          <div class="user-panel-head">
            <span class="avatar" aria-hidden="true"></span>
            <div class="user-panel-meta">
              <strong id="userPanelName">未登录</strong>
              <span class="user-panel-email" id="userPanelEmail"></span>
            </div>
          </div>
          <div class="user-panel-sep"></div>
          <a class="user-panel-item" href="/account"><span class="user-panel-ico" aria-hidden="true">⚙</span>设置</a>
          <div class="user-panel-sep"></div>
          <button class="user-panel-item user-panel-logout" type="button"><span class="user-panel-ico" aria-hidden="true">⏻</span>退出登录</button>
        </div>
      </div>
    </div>
  </header>

  <div class="page-shell">
    <!-- 左侧设置栏 -->
    <aside class="sidebar">
      <div class="side-title">设置</div>
      <nav class="side-nav">
        <a href="/account/repo">管线设置</a>
        <a href="/account/repos" class="active">仓库管理</a>
        <a href="/account">账号管理</a>
        <a href="/account/security">账号安全</a>
        <a href="/logs">日志</a>
        <a href="/tokens">Token 面板</a>
      </nav>
    </aside>

    <!-- 主内容 -->
    <div class="main-content">
      <div class="breadcrumb">
        <a href="/pipeline">管线</a>
        <span class="sep">›</span>
        <span class="current">仓库管理</span>
      </div>

      <h1 class="page-title"><em>仓库管理</em></h1>
      <p class="page-sub">登记本机仓库目录，并可给每个仓库绑定 GitHub 链接；管线设置里按仓库选择</p>

      <!-- 已登记仓库 -->
      <div class="section">
        <h2>已登记仓库 <span id="repoCount" style="color:var(--muted);font-weight:400;"></span></h2>
        <div class="repo-list" id="repoList"></div>
        <div class="empty-tip" id="repoEmpty" style="display:none;">暂无仓库，请在下方登记一个本机目录</div>
      </div>

      <!-- 新增仓库 -->
      <div class="section">
        <h2>新增仓库</h2>
        <form id="repoForm" autocomplete="off">
          <div class="form-row">
            <label for="newPath">本机仓库目录</label>
            <input type="text" id="newPath" placeholder="例如 D:\code\my-repo">
            <span class="form-hint">必须是本机真实存在的目录（绝对路径或相对当前工作目录）</span>
          </div>
          <div class="form-row">
            <label for="newName">仓库名称（可选）</label>
            <input type="text" id="newName" placeholder="留空则取目录名">
          </div>
          <div class="form-row">
            <label for="newGithub">GitHub 链接（可选）</label>
            <input type="text" id="newGithub" placeholder="https://github.com/owner/repo">
            <span class="form-hint">形如 https://github.com/owner/repo（可省略 https:// 前缀，末尾 / 与 .git 会被忽略）</span>
          </div>
          <div class="form-actions">
            <button class="btn primary" type="submit" id="addBtn">登记仓库</button>
            <span class="form-msg" id="addMsg"></span>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
