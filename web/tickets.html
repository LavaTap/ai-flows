<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工单系统 · AI-FLOWS 平台</title>
  <link rel="stylesheet" href="./ai-pipeline.css">
  <script src="/user-card.js" defer></script>
  <script src="/richtext-editor.js" defer></script>
  <script src="/user-menu.js" defer></script>
  <style>
    /* 工单页专用样式：左列表贴边 + 右详情 */
    body { background: var(--paper); }
    [hidden] { display: none !important; }

    .page-shell { padding: 0; }

    .btn { padding: 8px 16px; border-radius: 8px; font: 500 12px/18px var(--font-sans); cursor: pointer;
      border: 1px solid var(--glass-line); background: var(--glass-fill); color: var(--ink-soft); white-space: nowrap; }
    .btn:hover { background: var(--paper-2); }
    .btn.primary { background: var(--led); color: #fff; border-color: var(--led); }
    .btn.primary:hover { background: #4338ca; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .tk-layout { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 0;
      height: calc(100vh - 56px); }
    @media (max-width: 900px) { .tk-layout { grid-template-columns: minmax(0, 1fr); } }

    /* 去卡片化：无背景/边框/阴影，仅结构容器 */
    .card { background: transparent; border: none; border-radius: 0; box-shadow: none; }

    /* ---- 左列：筛选 + 列表 ---- */
    .side { padding: 16px 12px; height: 100%; overflow-y: auto;
      border-right: 1px solid var(--glass-line); background: var(--paper-2); }
    .side-top { display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px; }
    .side-top .new-mini { padding: 5px 12px; font-size: 11px; line-height: 16px; }
    .seg { display: flex; gap: 4px; background: var(--glass-fill); border-radius: 999px; padding: 3px; margin-bottom: 10px; }
    .seg button { flex: 1; border: 0; background: transparent; border-radius: 999px; cursor: pointer;
      font: 500 12px/18px var(--font-sans); color: var(--muted); padding: 6px 0; }
    .seg button.on { background: var(--glass-fill); color: var(--led); box-shadow: 0 1px 2px rgba(15,23,42,.08); }
    .tk-input { width: 100%; padding: 8px 12px; border: 1px solid var(--glass-line); border-radius: 8px;
      background: #fff; font: 400 13px/20px var(--font-sans); color: var(--ink); }
    .tk-input:focus { outline: none; border-color: var(--led); box-shadow: 0 0 0 3px var(--led-soft); }
    .mine-toggle { display: flex; align-items: center; gap: 6px; margin: 10px 0 4px;
      font: 400 12px/18px var(--font-sans); color: var(--muted); cursor: pointer; }

    .tk-list { list-style: none; margin: 12px 0 0; padding: 0; }
    .tk-item { padding: 10px 12px; border: 1px solid transparent; border-radius: 10px; cursor: pointer; }
    .tk-item:hover { background: var(--paper-2); }
    .tk-item.on { background: var(--led-soft); border-color: rgba(79,70,229,.25); }
    .tk-item-title { font: 600 13px/20px var(--font-sans); color: var(--ink-soft); margin-bottom: 6px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .tk-item-meta { display: flex; align-items: center; gap: 8px; font: 400 11px/16px var(--font-sans); color: var(--muted); }
    .tk-item-meta .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tk-empty { padding: 28px 12px; text-align: center; font: 400 12px/20px var(--font-sans); color: var(--muted-2); }

    .tk-badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font: 500 11px/16px var(--font-sans); flex: none; }
    .tk-badge.open { background: var(--amber-soft); color: var(--amber); }
    .tk-badge.doing { background: var(--led-soft); color: var(--led); }
    .tk-badge.resolved { background: var(--teal-soft); color: var(--teal); }
    .tk-badge.req { background: var(--paper-2); color: var(--muted); }

    /* ---- 右列：详情 / 编辑器 ---- */
    .panel { height: 100%; overflow-y: auto; padding: 28px 40px; }
    .panel-empty { display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; gap: 8px; color: var(--muted-2); font: 400 13px/20px var(--font-sans); }
    .tk-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
    .tk-head h2 { flex: 1; margin: 0; font: 600 19px/28px var(--font-sans); color: var(--ink); }
    .tk-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 400 12px/18px var(--font-sans); color: var(--muted); margin-bottom: 14px; }
    .tk-meta b { color: var(--ink-soft); font-weight: 500; }

    .tk-statusbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; margin-bottom: 16px;
      background: var(--paper-2); border-radius: 10px; }
    .tk-statusbar .label { font: 500 12px/18px var(--font-sans); color: var(--muted); margin-right: 2px; }
    .tk-statusbar button { border: 1px solid var(--glass-line); background: var(--glass-fill); border-radius: 999px;
      cursor: pointer; font: 500 12px/18px var(--font-sans); color: var(--muted); padding: 5px 14px; }
    .tk-statusbar button.on { border-color: transparent; color: #fff; }
    .tk-statusbar button.on.open { background: var(--amber); }
    .tk-statusbar button.on.doing { background: var(--led); }
    .tk-statusbar button.on.resolved { background: var(--teal); }
    .tk-statusbar button:disabled { opacity: .55; cursor: default; }

    .tk-content { font: 400 13px/22px var(--font-sans); color: var(--copy); word-break: break-word;
      border-top: 1px solid var(--glass-line); padding-top: 16px; }
    .tk-content img { max-width: 100%; border-radius: 8px; border: 1px solid var(--glass-line); }
    .tk-content blockquote { margin: 8px 0; padding: 6px 12px; border-left: 3px solid var(--glass-line-strong); color: var(--muted); }
    .tk-content ul, .tk-content ol { margin: 6px 0; padding-left: 22px; }
    .tk-content code { font-family: var(--font-mono); background: var(--paper-2); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
    .tk-content p { margin: 6px 0; }
    /* 图片左右环绕时不让浮动溢出容器 */
    .tk-content::after { content: ""; display: block; clear: both; }

    .tk-comments { margin-top: 22px; border-top: 1px solid var(--glass-line); padding-top: 16px; }
    .tk-comments h3 { margin: 0 0 12px; font: 600 13px/20px var(--font-sans); color: var(--ink-soft); }
    .tk-comment { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--glass-line); }
    .tk-comment:last-child { border-bottom: 0; }
    .tk-avatar { width: 30px; height: 30px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
      color: #fff; font: 600 12px/1 var(--font-sans); }
    .tk-comment-main { flex: 1; min-width: 0; }
    .tk-comment-who { font: 500 12px/18px var(--font-sans); color: var(--ink-soft); }
    .tk-comment-who span { color: var(--muted-2); font-weight: 400; margin-left: 6px; }
    .tk-comment-body { font: 400 13px/21px var(--font-sans); color: var(--copy); margin-top: 4px; word-break: break-word; }
    .tk-comment-body img { max-width: 100%; border-radius: 8px; }

    .tk-editor-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .tk-editor-head h2 { margin: 0; font: 600 16px/24px var(--font-sans); color: var(--ink-soft); }
    .tk-editor-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .tk-field-label { font: 500 12px/18px var(--font-sans); color: var(--muted); margin: 14px 0 6px; }

    /* 富文本编辑器样式见 ai-pipeline.css（.rt* / .mention-pop，由 /richtext-editor.js 产出） */
    /* @提及胶囊 / 悬停用户卡片 / 知识卡片样式见 ai-pipeline.css（共享 /user-card.js 渲染） */

    /* 兼容尚未升级的旧提及链接 */
    .tk-content a.mention-link, .tk-comment-body a.mention-link {
      color: var(--led); font-weight: 500; text-decoration: none; background: var(--led-soft);
      padding: 1px 6px; border-radius: 4px; }
    .tk-content a.mention-link:hover, .tk-comment-body a.mention-link:hover { text-decoration: underline; }

    /* 负责人 */
    .tk-none { color: var(--muted-2); }
    .tk-assign-btn { margin-left: 6px; padding: 2px 10px; border: 1px solid var(--glass-line); border-radius: 999px;
      background: var(--glass-fill); color: var(--led); cursor: pointer; font: 500 11px/16px var(--font-sans); }
    .tk-assign-btn:hover { border-color: var(--led); }
    .assign-pop { position: fixed; z-index: 200; width: 280px; padding: 10px; border-radius: 12px;
      background: var(--surface); border: 1px solid var(--glass-line); box-shadow: 0 8px 28px rgba(15,23,42,.18); }
    .assign-pop .ap-title { font: 500 12px/18px var(--font-sans); color: var(--muted); margin-bottom: 8px; }
    .assign-pop .ap-list { list-style: none; margin: 8px 0 0; padding: 0; max-height: 240px; overflow-y: auto; }
    .assign-pop .ap-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
    .assign-pop .ap-item:hover { background: var(--led-soft); }
    .assign-pop .ap-item .tk-avatar { width: 26px; height: 26px; font-size: 11px; }
    .assign-pop .ap-item .ap-meta { flex: 1; min-width: 0; }
    .assign-pop .ap-item .ap-name { font: 500 12px/18px var(--font-sans); color: var(--ink-soft); }
    .assign-pop .ap-item .ap-sub { font: 400 11px/16px var(--font-sans); color: var(--muted);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .assign-pop .ap-clear { display: block; width: 100%; margin-top: 8px; padding: 6px 8px; text-align: left;
      border: 0; border-top: 1px solid var(--glass-line); background: none; cursor: pointer;
      font: 400 12px/18px var(--font-sans); color: var(--block); }

    /* 纯文本评论输入区 */
    .tk-label-hint { font: 400 11px/16px var(--font-sans); color: var(--muted-2); margin-left: 6px; }
    .tk-comment-box { position: relative; }
    .tk-comment-input { width: 100%; box-sizing: border-box; min-height: 84px; max-height: 240px; padding: 10px 12px;
      border: 1px solid var(--glass-line); border-radius: 10px; background: var(--surface);
      font: 400 13px/21px var(--font-sans); color: var(--ink); resize: vertical; outline: none; }
    .tk-comment-input:focus { border-color: var(--led); box-shadow: 0 0 0 3px var(--led-soft); }

    /* 提交人可点击跳转 */
    .tk-meta .author-link { color: var(--led); cursor: pointer; text-decoration: none; }
    .tk-meta .author-link:hover { text-decoration: underline; }
    .tk-comment-who .author-link { color: inherit; text-decoration: none; cursor: pointer; }
    .tk-comment-who .author-link:hover { color: var(--led); }

    .tk-hint { font: 400 11px/16px var(--font-sans); color: var(--muted-2); margin-top: 6px; }
    .tk-error { font: 400 12px/18px var(--font-sans); color: var(--block); margin-top: 8px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot" aria-hidden="true"></span>
      <h1 class="brand-title">
        <span class="tt-pipeline">AI-FLOWS</span>
        <span class="tt-sep">/</span>
        <span>工单系统</span>
      </h1>
    </div>
    <div class="top-right">
      <a class="nav-link" href="/home">首页</a>
      <a class="nav-link" href="/pipeline" target="_blank" rel="noopener">AI 管线</a>
      <a class="nav-link active" href="/tickets">工单</a>
      <a class="nav-link" href="/kb" target="_blank" rel="noopener">知识库</a>
      <a class="nav-link" href="/github-audit">GitHub</a>
      <a class="nav-link" href="/team" id="teamLink" style="display:none;">团队管理</a>
      <a class="nav-link" href="/chat" target="_blank" rel="noopener">AI 对话</a>
      <div class="user-menu">
        <span class="user-chip" id="userChip" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false"><span class="avatar" aria-hidden="true"></span><span id="userName">未登录</span></span>
        <div class="user-panel" id="userPanel" hidden>
          <div class="user-panel-head">
            <span class="avatar" aria-hidden="true"></span>
            <div class="user-panel-meta">
              <strong id="userPanelName">未登录</strong>
              <span class="user-panel-email" id="userPanelEmail"></span>
            </div>
          </div>
          <div class="user-panel-sep"></div>
          <a class="user-panel-item" href="/account"><span class="user-panel-ico" aria-hidden="true">⚙</span>设置</a>
          <div class="user-panel-sep"></div>
          <button class="user-panel-item user-panel-logout" type="button"><span class="user-panel-ico" aria-hidden="true">⏻</span>退出登录</button>
    </div>
  </header>

  <div class="page-shell">
    <div class="tk-layout">
      <!-- 左列：筛选 + 列表（贴边） -->
      <aside class="card side">
        <div class="side-top">
          <div style="font:600 13px/18px var(--font-sans); color:var(--ink);">工单</div>
          <button class="btn primary new-mini" id="newBtn" type="button">+ 新建</button>
        </div>
        <div class="seg" id="statusSeg">
          <button type="button" data-status="all" class="on">全部</button>
          <button type="button" data-status="open">待处理</button>
          <button type="button" data-status="doing">处理中</button>
          <button type="button" data-status="resolved">已解决</button>
        </div>
        <input class="tk-input" id="searchInput" type="search" placeholder="搜索标题 / 提交人 / 负责人" maxlength="60">
        <label class="mine-toggle"><input type="checkbox" id="mineOnly"> 只看我提交的</label>
        <ul class="tk-list" id="ticketList"></ul>
      </aside>

      <!-- 右列：详情 / 编辑器 -->
      <section class="card panel">
        <div class="panel-empty" id="emptyState">
          <span>选择左侧工单查看详情，或点「新建工单」</span>
        </div>

        <div id="detailView" hidden>
          <div class="tk-head">
            <h2 id="dTitle"></h2>
            <div style="display:flex;align-items:center;gap:8px;">
              <button class="btn" id="editBtn" type="button" style="display:none;">编辑</button>
              <span class="tk-badge" id="dStatus"></span>
            </div>
          </div>
          <div class="tk-meta" id="dMeta"></div>
          <div class="tk-statusbar" id="dStatusBar"></div>
          <div class="tk-content" id="dContent"></div>
          <div class="tk-comments">
            <h3 id="dCommentTitle">评论</h3>
            <div id="dComments"></div>
            <div class="tk-field-label">追加评论 <span class="tk-label-hint">纯文本，输入 @ 可提及成员</span></div>
            <div class="tk-comment-box">
              <textarea class="tk-comment-input" id="commentInput" rows="3" maxlength="4000"
                placeholder="补充说明…输入 @ 可以提及成员"></textarea>
            </div>
            <div class="tk-editor-foot">
              <button class="btn primary" id="commentSubmit" type="button">发表评论</button>
            </div>
            <div class="tk-error" id="commentError" hidden></div>
          </div>
        </div>

        <div id="editorView" hidden>
          <div class="tk-editor-head">
            <h2>新建工单</h2>
            <button class="btn" id="cancelBtn" type="button">取消</button>
          </div>
          <div class="tk-field-label">标题</div>
          <input class="tk-input" id="eTitle" maxlength="100" placeholder="一句话说明问题，如：报告页在 Safari 下错位">
          <div class="tk-field-label">问题描述</div>
          <div id="editorHost"></div>
          <div class="tk-hint">支持字号 / 对齐 / 列表 / 引用 / @提及成员；插入图片后可点选图片设置尺寸与文字环绕（也可拖右下角手柄缩放）；点工具条「知识库」可引用文章（插入后显示为知识卡片）；图片上限 6MB。</div>
          <div class="tk-editor-foot">
            <button class="btn" id="cancelBtn2" type="button">取消</button>
            <button class="btn primary" id="saveBtn" type="button">提交工单</button>
          </div>
          <div class="tk-error" id="editorError" hidden></div>
        </div>
      </section>
    </div>
  </div>

  <!-- 悬停用户卡片（@提及 / 提交人 / 负责人 共用） -->
  <div class="user-card" id="userCard" hidden></div>
</body>
</html>
