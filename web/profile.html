<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>员工主页 · AI-FLOWS 平台</title>
  <link rel="stylesheet" href="/ai-pipeline.css">
  <script src="/user-menu.js" defer></script>
  <style>
    .page-wrap{max-width:none;margin:0;padding:0 0 80px;}
    .breadcrumb{display:flex;align-items:center;gap:8px;font:400 12px/18px var(--font-sans);color:var(--muted);margin:0 auto 18px;max-width:1200px;padding:0 32px;width:100%;box-sizing:border-box;}
    .breadcrumb a{color:var(--muted);text-decoration:none;}
    .breadcrumb a:hover{color:var(--led);}
    .breadcrumb .sep{opacity:.5;}
    .breadcrumb .current{color:var(--ink-soft);font-weight:500;}

    /* 顶部 banner：全宽铺满，约占视口 1/4 */
    .profile-banner{
      position:relative;
      width:100%;
      height:280px;
      overflow:hidden;
      background:
        linear-gradient(180deg, rgba(15,23,42,.18) 0%, rgba(15,23,42,.05) 40%, rgba(15,23,42,.25) 100%),
        url("/profile-bg.jpg") center/cover no-repeat;
      flex-shrink:0;
    }

    /* 资料区容器：全宽，内内容 1200px 居中 */
    .profile-main{
      position:relative;
      max-width:1200px;
      margin:0 auto;
      padding:0 32px;
      box-sizing:border-box;
    }

    /* 头像：骑跨在 banner 与资料区交界，改到左边 */
    .profile-hero{
      position:relative;
      height:0;
    }
    .hero-avatar{
      position:absolute;
      top:-68px;
      left:32px;
      width:136px;
      height:136px;
      border-radius:50%;
      background:#fff;
      padding:5px;
      box-shadow:0 10px 28px rgba(15,23,42,.18), 0 2px 8px rgba(15,23,42,.08);
      overflow:hidden;
      z-index:3;
    }
    .hero-avatar .av-inner{
      width:100%;
      height:100%;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font:700 48px/1 var(--font-sans);
      overflow:hidden;
    }
    .hero-avatar img{width:100%;height:100%;object-fit:cover;}

    /* 资料区：无边框无卡片，直接铺满 */
    .profile-info{
      position:relative;
      padding:80px 0 28px;
    }

    .info-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:24px;
      margin-bottom:24px;
    }
    .info-head h2{
      margin:0 0 6px;
      font:700 24px/32px var(--font-sans);
      color:var(--ink-soft);
    }
    .info-head .sub{
      font:400 13px/20px var(--font-sans);
      color:var(--muted);
    }
    .role-tag{
      padding:4px 14px;
      border-radius:999px;
      font:500 12px/18px var(--font-sans);
      flex:none;
      align-self:center;
    }
    .role-tag.supervisor{background:var(--led-soft);color:var(--led);}
    .role-tag.staff{background:var(--teal-soft);color:var(--teal);}

    .info-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:16px 28px;
      padding:22px 0;
      border-top:1px solid var(--glass-line);
      border-bottom:1px solid var(--glass-line);
    }
    .info-item{display:flex;flex-direction:column;gap:4px;}
    .info-label{font:400 11px/16px var(--font-sans);color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
    .info-value{font:500 13.5px/20px var(--font-sans);color:var(--ink-soft);word-break:break-all;}
    .info-value.mono{font-family:var(--font-mono);font-size:13px;}
    .info-value .gh-link{color:var(--teal);text-decoration:none;font-family:var(--font-mono);font-size:13px;}
    .info-value .gh-link:hover{text-decoration:underline;}
    .gh-pending{display:inline-block;padding:2px 8px;border-radius:6px;
      background:var(--amber-soft);color:var(--amber);font:500 11px/16px var(--font-sans);
      border:1px solid var(--amber-line);}

    /* 知识库文章区：卡片网格 */
    .kb-section{
      margin-top:40px;
    }
    .kb-section-head{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      margin-bottom:16px;
    }
    .kb-section-head h3{
      margin:0;
      font:700 18px/26px var(--font-sans);
      color:var(--ink-soft);
    }
    .kb-section-head .count{
      font:400 12px/18px var(--font-sans);
      color:var(--muted);
    }

    .kb-card-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px;
      list-style:none;
      margin:0;
      padding:0;
    }

    .kb-card-item{
      display:flex;
      flex-direction:column;
      gap:10px;
      padding:18px 20px;
      border:1px solid var(--glass-line);
      border-radius:14px;
      background:var(--glass-fill);
      cursor:pointer;
      transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    }
    .kb-card-item:hover{
      border-color:var(--led);
      box-shadow:0 6px 20px rgba(79,70,229,.1);
      transform:translateY(-2px);
    }

    .kb-card-item .kb-card-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .kb-card-item .kb-card-ico{
      width:34px;
      height:34px;
      border-radius:9px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--led-soft);
      color:var(--led);
      font-size:16px;
      flex:none;
    }
    .kb-card-item .tk-badge{
      flex:none;
    }

    .kb-card-item .kb-card-title{
      font:600 14px/22px var(--font-sans);
      color:var(--ink-soft);
      margin:2px 0 0;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
      min-height:44px;
    }

    .kb-card-item .kb-card-meta{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-top:auto;
      padding-top:10px;
      border-top:1px solid var(--glass-line);
      font:400 11.5px/16px var(--font-sans);
      color:var(--muted);
    }

    .kb-empty{
      padding:48px 16px;
      text-align:center;
      font:400 13px/20px var(--font-sans);
      color:var(--muted);
      background:var(--paper-2);
      border:1px dashed var(--glass-line);
      border-radius:14px;
    }

    @media (max-width: 960px) {
      .kb-card-grid{grid-template-columns:repeat(2,1fr);}
    }
    @media (max-width: 720px) {
      .breadcrumb{padding:0 16px;margin-bottom:14px;}
      .profile-banner{height:220px;}
      .profile-main{padding:0 16px;}
      .hero-avatar{left:16px;width:100px;height:100px;top:-50px;}
      .hero-avatar .av-inner{font-size:36px;}
      .profile-info{padding-top:64px;}
      .info-head{flex-direction:column;align-items:flex-start;gap:10px;}
      .info-grid{grid-template-columns:repeat(2,1fr);gap:14px;}
      .kb-card-grid{grid-template-columns:1fr;}
    }
    @media (max-width: 480px) {
      .info-grid{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1 class="brand-title">
        <span class="tt-pipeline">AI-FLOWS</span>
        <span class="tt-sep">/</span>
        <span>员工主页</span>
      </h1>
    </div>
    <div class="top-right">
      <a href="/home" class="nav-link">首页</a>
      <a href="/pipeline" class="nav-link" target="_blank" rel="noopener">AI 管线</a>
      <a href="/tickets" class="nav-link" target="_blank" rel="noopener">工单</a>
      <a href="/kb" class="nav-link" target="_blank" rel="noopener">知识库</a>
      <a href="/reviews" class="nav-link" target="_blank" rel="noopener">代码评审</a>


      <a href="/chat" class="nav-link" target="_blank" rel="noopener">AI 对话</a>
      <div class="user-menu">
        <span class="user-chip" id="userChip" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false"><span class="avatar" aria-hidden="true"></span><span id="userName">未登录</span></span>
        <div class="user-panel" id="userPanel" hidden>
          <div class="user-panel-head">
            <span class="avatar" aria-hidden="true"></span>
            <div class="user-panel-meta">
              <strong id="userPanelName">未登录</strong>
              <span class="user-panel-email" id="userPanelEmail"></span>
            </div>
          </div>
          <div class="user-panel-sep"></div>
          <a class="user-panel-item" href="/account"><span class="user-panel-ico" aria-hidden="true">⚙</span>设置</a>
          <div class="user-panel-sep"></div>
          <button class="user-panel-item user-panel-logout" type="button"><span class="user-panel-ico" aria-hidden="true">⏻</span>退出登录</button>
        </div>
      </div>
    </div>
  </header>

  <main class="page-wrap">
    <div class="breadcrumb">
      <a href="/home">首页</a>
      <span class="sep">›</span>
      <a href="/team" id="teamCrumb">团队</a>
      <span class="sep">›</span>
      <span class="current" id="crumbName">员工</span>
    </div>

    <!-- 顶部 banner（全宽，仅背景；员工信息统一到头像下方的资料区） -->
    <section class="profile-banner" aria-hidden="false"></section>

    <div class="profile-main">
      <!-- 骑跨头像：介于背景图与内容之间，左侧 -->
      <div class="profile-hero" aria-hidden="false">
        <div class="hero-avatar" id="heroAvatar">
          <div class="av-inner">?</div>
        </div>
      </div>

      <!-- 资料区（无边框无卡片，直接铺满） -->
      <section class="profile-info">
        <div class="info-head">
          <div>
            <h2 id="profileName">加载中…</h2>
            <div class="sub" id="profileEmailLine">邮箱</div>
          </div>
          <span class="role-tag" id="roleTag">员工</span>
        </div>

        <div class="info-grid">
          <div class="info-item">
            <span class="info-label">部门</span>
            <span class="info-value" id="infoDept">—</span>
          </div>
          <div class="info-item">
            <span class="info-label">职位</span>
            <span class="info-value" id="infoTitle">—</span>
          </div>
          <div class="info-item">
            <span class="info-label">邮箱</span>
            <span class="info-value mono" id="infoEmail">—</span>
          </div>
          <div class="info-item">
            <span class="info-label">GitHub</span>
            <span class="info-value mono" id="infoGithub">—</span>
          </div>
        </div>
      </section>

      <!-- 知识库文章区（卡片网格） -->
      <section class="kb-section">
        <div class="kb-section-head">
          <h3>TA 的知识库文章</h3>
          <span class="count" id="kbCount">0 篇</span>
        </div>
        <ul class="kb-card-grid" id="kbList">
          <!-- 由 profile.js 渲染 -->
        </ul>
        <div class="kb-empty" id="kbEmpty" hidden>
          这位同事还没有发布过知识库文章。
        </div>
      </section>
    </div>
  </main>
</body>
</html>
