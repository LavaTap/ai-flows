<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · AI-FLOWS 平台</title>
  <link rel="stylesheet" href="./login.css">
</head>
<body>
  <main class="card">
    <div class="brand">
      <span class="dot" aria-hidden="true"></span>
      <span class="name">AI-FLOWS · AI 管线平台</span>
    </div>
    <h1>登录平台</h1>
    <p class="sub">账号由管理员预先录入，暂不开放注册。</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">邮箱</label>
        <input id="email" name="email" type="email" autocomplete="username"
          placeholder="name@ai-flows.com" required>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
          placeholder="••••••" required>
      </div>
      <p class="error" id="error" role="alert" aria-live="polite"></p>
      <button type="submit" id="submitBtn">登 录</button>
    </form>

    <p class="demo">
      演示账号（密码统一 <code>123456</code>）：<br>
      主管 <code>zhaoli@ai-flows.com</code> ·
      员工 <code>wangxinyi@ai-flows.com</code> ·
      员工 <code>lixiang@ai-flows.com</code>
    </p>
  </main>

  <script>
    (function () {
      var form = document.getElementById("loginForm");
      var errorEl = document.getElementById("error");
      var submitBtn = document.getElementById("submitBtn");

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        errorEl.classList.remove("show");
        var email = document.getElementById("email").value.trim();
        var password = document.getElementById("password").value;
        if (!email || !password) {
          errorEl.textContent = "请输入邮箱和密码";
          errorEl.classList.add("show");
          return;
        }
        submitBtn.disabled = true;
        submitBtn.textContent = "登录中…";
        fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, password: password })
        }).then(function (r) {
          return r.json().then(function (data) { return { ok: r.ok, data: data }; });
        }).then(function (res) {
          if (res.ok) {
            location.href = "/pipeline";
            return;
          }
          errorEl.textContent = (res.data && res.data.error) || "登录失败，请重试";
          errorEl.classList.add("show");
          submitBtn.disabled = false;
          submitBtn.textContent = "登 录";
        }).catch(function () {
          errorEl.textContent = "网络异常，请重试";
          errorEl.classList.add("show");
          submitBtn.disabled = false;
          submitBtn.textContent = "登 录";
        });
      });
    })();
  </script>
</body>
</html>
