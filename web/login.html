<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · AI-FLOWS 平台</title>
  <link rel="stylesheet" href="./login.css">
</head>
<body class="login-page">
  <div class="bg-art" aria-hidden="true"></div>

  <div class="login-shell">
    <section class="intro">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">AI</span>
        <span class="brand-name">AI-FLOWS</span>
      </div>
      <h1 class="headline">AIFLOWS零信任登录平台 <span class="grad">AI 管线平台</span></h1>
      <p class="intro-sub">汇聚 AI 评审能力与管线数据，让交付更高效，让质量更清晰。</p>
    </section>

    <section class="login-card">
      <h2 class="card-title">欢迎登录</h2>
      <p class="card-sub">AI-FLOWS · AI 管线平台</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <input id="email" name="email" type="email" autocomplete="username"
            aria-label="邮箱" placeholder="请输入邮箱" required>
        </div>
        <div class="field">
          <input id="password" name="password" type="password" autocomplete="current-password"
            aria-label="密码" placeholder="请输入密码" required>
        </div>

        <div class="links">
          <span class="link link-register" title="演示占位，暂未开放">立即注册</span>
          <span class="link link-forgot" title="演示占位，暂未开放">忘记密码？</span>
        </div>

        <p class="error" id="error" role="alert" aria-live="polite"></p>
        <button type="submit" id="submitBtn">登 录</button>
      </form>

      <div class="divider"><span>其他登录方式</span></div>
      <div class="socials">
        <span class="social" title="微信（演示占位）" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="24" height="24" focusable="false">
            <path fill="#07C160" d="M12.4 4.5C7.2 4.5 3 8 3 12.3c0 2.4 1.4 4.5 3.6 5.9l-.9 2.8 3.2-1.6c1.1.3 2.3.5 3.5.5h.6a7.4 7.4 0 0 1-.3-2.1c0-3.9 3.8-7.1 8.6-7.1h.8c-1.2-3.4-5-6.2-9.7-6.2Zm-3.2 4a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6Zm6.4 0a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6Z"/>
            <path fill="#07C160" d="M29 17.8c0-3.4-3.4-6.2-7.6-6.2s-7.6 2.8-7.6 6.2 3.4 6.2 7.6 6.2c.9 0 1.7-.1 2.5-.3l2.6 1.3-.7-2.2c1.9-1.1 3.2-2.9 3.2-5Zm-10.1-1a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2Zm5.1 0a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2Z"/>
          </svg>
        </span>
        <span class="social" title="QQ（演示占位）" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="24" height="24" focusable="false">
            <path fill="#12B7F5" d="M16 2.8c-3.9 0-6.5 2.9-6.5 6.9 0 .9-.6 1.6-1.1 2.4-.9 1.4-1.8 3-1.8 4.7 0 1.1.5 2 1.3 2.3.4.2.9.1 1.3-.1.2.7.5 1.4 1 2-.6.4-.9 1-.9 1.6 0 1.6 2.3 2.6 6.7 2.6s6.7-1 6.7-2.6c0-.6-.3-1.2-.9-1.6.4-.6.8-1.3 1-2 .4.2.9.3 1.3.1.8-.3 1.3-1.2 1.3-2.3 0-1.7-.9-3.3-1.8-4.7-.5-.8-1.1-1.5-1.1-2.4 0-4-2.6-6.9-6.5-6.9Z"/>
            <circle cx="13.4" cy="9.4" r="1.5" fill="#fff"/>
            <circle cx="18.6" cy="9.4" r="1.5" fill="#fff"/>
            <path fill="#F5A623" d="M14.7 12.6h2.6l-1.3 1.6z"/>
          </svg>
        </span>
        <span class="social" title="钉钉（演示占位）" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="24" height="24" focusable="false">
            <rect x="3" y="3" width="26" height="26" rx="8" fill="#3296FA"/>
            <path fill="#fff" d="M21.6 8.6 10.2 13l4.4 1.8-1.8 5.1 3.4-2.4 1.9 3.7Z"/>
          </svg>
        </span>
      </div>
    </section>
  </div>

  <p class="demo-hint">
    谨遵绿色职场规范，保护账号安全。每十天必须重置密码。
  </p>

  <script>
    (function () {
      var form = document.getElementById("loginForm");
      var errorEl = document.getElementById("error");
      var submitBtn = document.getElementById("submitBtn");

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        errorEl.classList.remove("show");
        var email = document.getElementById("email").value.trim();
        var password = document.getElementById("password").value;
        if (!email || !password) {
          errorEl.textContent = "请输入邮箱和密码";
          errorEl.classList.add("show");
          return;
        }
        submitBtn.disabled = true;
        submitBtn.textContent = "登录中…";
        fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, password: password })
        }).then(function (r) {
          return r.json().then(function (data) { return { ok: r.ok, data: data }; });
        }).then(function (res) {
          if (res.ok) {
            location.href = "/pipeline";
            return;
          }
          errorEl.textContent = (res.data && res.data.error) || "登录失败，请重试";
          errorEl.classList.add("show");
          submitBtn.disabled = false;
          submitBtn.textContent = "登 录";
        }).catch(function () {
          errorEl.textContent = "网络异常，请重试";
          errorEl.classList.add("show");
          submitBtn.disabled = false;
          submitBtn.textContent = "登 录";
        });
      });
    })();
  </script>
</body>
</html>
