<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统日志 · AI-FLOWS 平台</title>
  <link rel="stylesheet" href="/ai-pipeline.css">
  <script src="/user-menu.js" defer></script>
  <style>
    /* 日志页专用样式：顶部工具条 + 嵌入式终端（等宽字体、逐行输出，替代原表格） */
    body { background: var(--paper); }
    [hidden] { display: none !important; }

    .logs-wrap { padding: 20px 32px 32px; }

    .logs-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .seg { display: flex; gap: 4px; background: var(--glass-fill); border-radius: 999px; padding: 3px;
      border: 1px solid var(--glass-line); }
    .seg button { border: 0; background: transparent; border-radius: 999px; cursor: pointer;
      font: 500 12px/18px var(--font-sans); color: var(--muted); padding: 6px 16px; }
    .seg button.on { background: var(--led-soft); color: var(--led); box-shadow: 0 1px 2px rgba(15,23,42,.08); }

    .logs-grow { flex: 1; }
    .logs-auto { display: flex; align-items: center; gap: 6px; cursor: pointer;
      font: 400 12px/18px var(--font-sans); color: var(--muted); }
    .logs-updated { font: 400 11px/16px var(--font-sans); color: var(--muted-2); min-width: 90px; text-align: right; }

    .btn { padding: 7px 16px; border-radius: 8px; font: 500 12px/18px var(--font-sans); cursor: pointer;
      border: 1px solid var(--glass-line); background: var(--glass-fill); color: var(--ink-soft); white-space: nowrap; }
    .btn:hover { background: var(--paper-2); }
    /* 终止服务：危险操作，红字红边 */
    .btn.danger { color: var(--block); border-color: rgba(239,68,68,.45); }
    .btn.danger:hover { background: rgba(239,68,68,.10); }
    .btn.danger:disabled { opacity: .5; cursor: not-allowed; }

    /* ---- 终端面板 ---- */
    .term { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; overflow: hidden;
      box-shadow: 0 1px 2px rgba(15,23,42,.10), 0 8px 24px rgba(15,23,42,.12); }

    .term-bar { display: flex; align-items: center; gap: 12px; padding: 9px 14px;
      background: #1e293b; border-bottom: 1px solid rgba(255,255,255,.06); }
    .term-dots { display: flex; gap: 6px; flex: none; }
    .term-dots i { width: 10px; height: 10px; border-radius: 50%; display: block; }
    .term-dots i:nth-child(1) { background: #f87171; }
    .term-dots i:nth-child(2) { background: #fbbf24; }
    .term-dots i:nth-child(3) { background: #34d399; }
    .term-path { flex: 1; min-width: 0; font: 500 11.5px/16px var(--font-mono); color: #94a3b8;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .term-live { display: inline-flex; align-items: center; gap: 6px; flex: none;
      font: 400 11px/16px var(--font-mono); color: #64748b; }
    .term-live i { width: 7px; height: 7px; border-radius: 50%; background: #34d399;
      box-shadow: 0 0 6px rgba(52,211,153,.7); }
    .term-live.off i { background: #64748b; box-shadow: none; }

    .term-scroll { height: calc(100vh - 188px); min-height: 240px; overflow: auto; padding: 12px 16px 16px;
      font: 400 12px/20px var(--font-mono); color: #cbd5e1;
      scrollbar-color: #334155 transparent; }
    .term-scroll::-webkit-scrollbar { width: 10px; height: 10px; }
    .term-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 6px; }

    .term-line { display: flex; flex-wrap: wrap; gap: 0 10px; white-space: pre-wrap; word-break: break-all;
      padding: 1px 6px; border-radius: 4px; }
    .term-line:hover { background: rgba(148,163,184,.08); }
    .term-line .t-at { color: #64748b; flex: none; }
    .term-line .t-tag { flex: none; }
    .term-line .t-tag.review { color: #a5b4fc; }
    .term-line .t-tag.chat { color: #5eead4; }
    .term-line .t-tag.skill { color: #fcd34d; }
    .term-line .t-tag.web { color: #7dd3fc; }
    .term-line .t-model { color: #e2e8f0; }
    .term-line .t-target { color: #94a3b8; }
    .term-line .t-user { color: #94a3b8; }
    .term-line .t-ms { color: #64748b; }
    .term-line .t-meta { color: #64748b; }
    .term-line .t-ok { color: #34d399; }
    .term-line .t-err { color: #f87171; }
    .term-line .t-status.s2 { color: #34d399; }
    .term-line .t-status.s3 { color: #7dd3fc; }
    .term-line .t-status.s4 { color: #fbbf24; }
    .term-line .t-status.s5 { color: #f87171; }

    /* 光标：终端末尾的闪烁方块 */
    .term-cursor { display: inline-block; width: 7px; height: 14px; margin-left: 2px;
      background: #64748b; vertical-align: -2px; animation: term-blink 1.1s step-end infinite; }
    @keyframes term-blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .term-cursor { animation: none; } }

    .term-empty { padding: 28px 6px; color: #64748b; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1 class="brand-title">
        <span class="tt-pipeline">AI-FLOWS</span>
        <span class="tt-sep">/</span>
        <span>系统日志</span>
      </h1>
    </div>
    <div class="top-right">
      <a class="nav-link" href="/home">首页</a>
      <a class="nav-link" href="/pipeline" target="_blank" rel="noopener">AI 管线</a>
      <a class="nav-link" href="/tickets">工单</a>
      <a class="nav-link" href="/kb" target="_blank" rel="noopener">知识库</a>
      <a class="nav-link" href="/reviews" target="_blank" rel="noopener">代码评审</a>

      <a class="nav-link" href="/chat" target="_blank" rel="noopener">AI 对话</a>
      <div class="user-menu">
        <span class="user-chip" id="userChip" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false"><span class="avatar" aria-hidden="true"></span><span id="userName">未登录</span></span>
        <div class="user-panel" id="userPanel" hidden>
          <div class="user-panel-head">
            <span class="avatar" aria-hidden="true"></span>
            <div class="user-panel-meta">
              <strong id="userPanelName">未登录</strong>
              <span class="user-panel-email" id="userPanelEmail"></span>
            </div>
          </div>
          <div class="user-panel-sep"></div>
          <a class="user-panel-item" href="/account"><span class="user-panel-ico" aria-hidden="true">⚙</span>设置</a>
          <div class="user-panel-sep"></div>
          <button class="user-panel-item user-panel-logout" type="button"><span class="user-panel-ico" aria-hidden="true">⏻</span>退出登录</button>
        </div>
      </div>
    </div>
  </header>

  <div class="page-shell">
    <div class="logs-wrap">
      <div class="logs-head">
        <div class="seg" id="kindSeg">
          <button type="button" data-kind="ai" class="on">AI 请求日志</button>
          <button type="button" data-kind="web">网页访问日志</button>
        </div>
        <span class="logs-grow"></span>
        <label class="logs-auto"><input type="checkbox" id="autoRefresh" checked> 自动刷新（3 秒）</label>
        <button class="btn" id="refreshBtn" type="button">刷新</button>
        <button class="btn danger" id="terminateBtn" type="button" hidden>终止服务</button>
        <span class="logs-updated" id="logUpdated"></span>
      </div>
      <div class="term">
        <div class="term-bar">
          <span class="term-dots" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="term-path" id="termPath">logs/ai.log</span>
          <span class="term-live" id="termLive"><i aria-hidden="true"></i><span id="termLiveText">实时</span></span>
        </div>
        <div class="term-scroll" id="termScroll">
          <div id="termBody"></div>
          <div class="term-empty" id="logEmpty" hidden>暂无日志。有 AI 调用或页面访问后会出现在这里。</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
