<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 对话 · AI-FLOWS 平台</title>
  <link rel="stylesheet" href="/ai-pipeline.css">
  <!-- Markdown 渲染依赖：marked（解析）+ DOMPurify（XSS 过滤）+ highlight.js（代码高亮）+ mermaid（SVG 图表） -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js" defer></script>
  <script src="/user-menu.js" defer></script>
  <style>
    /* AI 对话页专属样式（沿用 ai-pipeline.css 变量体系） */
    .chat-layout {
      display: flex;
      height: calc(100vh - 56px);
      overflow: hidden;
    }
    .chat-sidebar {
      width: var(--sidebar-w);
      background: var(--glass-fill-soft);
      border-right: 1px solid var(--glass-line);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .chat-sidebar .sidebar-head {
      padding: var(--s-16);
      border-bottom: 1px solid var(--glass-line);
    }
    .chat-sidebar .sidebar-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .chat-sidebar .new-chat-btn {
      margin: var(--s-12) var(--s-16);
      padding: 10px var(--s-16);
      background: var(--led);
      color: #fff;
      border: none;
      border-radius: 8px;
      font: 500 13px/1 var(--font-sans);
      cursor: pointer;
      transition: background 0.15s;
    }
    .chat-sidebar .new-chat-btn:hover { background: #4338ca; }
    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: var(--s-8) 0;
    }
    .session-item {
      padding: 10px var(--s-16);
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.12s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .session-item:hover { background: var(--paper-2); }
    .session-item.active {
      border-left-color: var(--led);
      background: var(--led-soft);
    }
    .session-item .si-title {
      flex: 1;
      font-size: 13px;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .session-item.active .si-title { color: var(--led); font-weight: 500; }
    .session-item .si-del {
      opacity: 0;
      background: none;
      border: none;
      color: var(--muted-2);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .session-item:hover .si-del { opacity: 1; }
    .session-item .si-del:hover { color: var(--block); background: rgba(239,68,68,0.1); }
    .session-item .si-rename {
      opacity: 0;
      background: none;
      border: none;
      color: var(--muted-2);
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      padding: 3px 4px;
      border-radius: 4px;
    }
    .session-item:hover .si-rename { opacity: 1; }
    .session-item .si-rename:hover { color: var(--led); background: var(--led-soft); }
    .session-item .si-input {
      flex: 1;
      min-width: 0;
      padding: 4px 6px;
      font: 500 13px/1.4 var(--font-sans);
      color: var(--ink);
      background: var(--glass-fill);
      border: 1px solid var(--led);
      border-radius: 6px;
      outline: none;
    }
    .chat-sidebar .model-bar {
      padding: var(--s-12) var(--s-16);
      border-top: 1px solid var(--glass-line);
    }
    .model-bar label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 500;
    }
    .model-bar select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--glass-line-strong);
      border-radius: 8px;
      background: var(--glass-fill);
      color: var(--ink);
      font: 400 13px/1.4 var(--font-sans);
      cursor: pointer;
      outline: none;
    }
    .model-bar select:focus { border-color: var(--led); }

    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      min-width: 0;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: var(--s-24) var(--s-32);
    }
    .msg {
      display: flex;
      gap: var(--s-12);
      margin-bottom: var(--s-20);
      max-width: 860px;
    }
    .msg.user { flex-direction: row-reverse; margin-left: auto; }
    .msg .bubble {
      padding: var(--s-12) var(--s-16);
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.7;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .msg.user .bubble {
      background: var(--led);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant .bubble {
      background: var(--glass-fill);
      color: var(--ink);
      border: 1px solid var(--glass-line);
      border-bottom-left-radius: 4px;
      white-space: normal;
    }
    /* ── Markdown 正文样式（assistant 气泡内） ── */
    .bubble .md-body > :first-child { margin-top: 0; }
    .bubble .md-body > :last-child { margin-bottom: 0; }
    .bubble .md-body p { margin: 0 0 0.7em; }
    .bubble .md-body h1, .bubble .md-body h2, .bubble .md-body h3,
    .bubble .md-body h4, .bubble .md-body h5, .bubble .md-body h6 {
      margin: 1em 0 0.5em; font-weight: 600; line-height: 1.35;
    }
    .bubble .md-body h1 { font-size: 1.5em; }
    .bubble .md-body h2 { font-size: 1.3em; }
    .bubble .md-body h3 { font-size: 1.15em; }
    .bubble .md-body h4 { font-size: 1.05em; }
    .bubble .md-body ul, .bubble .md-body ol { margin: 0.4em 0; padding-left: 1.6em; }
    .bubble .md-body li { margin: 0.2em 0; }
    .bubble .md-body a { color: var(--led); text-decoration: underline; text-underline-offset: 2px; }
    .bubble .md-body blockquote {
      margin: 0.6em 0; padding: 0.4em 1em;
      border-left: 3px solid var(--led); background: var(--paper-2);
      color: var(--muted); border-radius: 0 6px 6px 0;
    }
    .bubble .md-body blockquote > :last-child { margin-bottom: 0; }
    .bubble .md-body hr { border: none; border-top: 1px solid var(--glass-line-strong); margin: 1em 0; }
    .bubble .md-body table {
      border-collapse: collapse; margin: 0.6em 0; width: 100%;
      font-size: 13px; display: block; overflow-x: auto;
    }
    .bubble .md-body th, .bubble .md-body td {
      border: 1px solid var(--glass-line-strong); padding: 6px 10px; text-align: left;
    }
    .bubble .md-body th { background: var(--paper-2); font-weight: 600; }
    .bubble .md-body code {
      font-family: var(--font-mono, monospace); font-size: 0.88em;
      background: var(--paper-2); padding: 0.1em 0.4em; border-radius: 4px;
    }
    .bubble .md-body pre {
      margin: 0.6em 0; padding: 12px 14px; border-radius: 8px;
      background: #0d1117; overflow-x: auto; border: 1px solid var(--glass-line);
    }
    .bubble .md-body pre code {
      background: none; padding: 0; font-size: 0.85em; line-height: 1.55; color: #e6edf3;
    }
    .bubble .md-body pre code.hljs { background: transparent; padding: 0; }
    /* mermaid 图表容器 */
    .bubble .md-body .mermaid {
      margin: 0.8em 0; padding: 12px; text-align: center;
      background: var(--paper); border: 1px solid var(--glass-line); border-radius: 8px;
      overflow-x: auto; min-height: 40px;
    }
    .bubble .md-body .mermaid svg { max-width: 100%; height: auto; }
    /* 手写 SVG 图表（shadow DOM 隔离渲染，样式已在内部生效） */
    .bubble .md-body .svg-figure { margin: 0.8em 0; }
    /* mermaid 加载中 / 失败状态 */
    .bubble .md-body .mermaid-loading {
      color: var(--muted); font-size: 12px; font-style: italic;
      padding: 16px; text-align: center;
    }
    .bubble .md-body .mermaid-error {
      margin: 0.8em 0; padding: 10px 12px;
      background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
    }
    .bubble .md-body .mermaid-error-title {
      font: 500 12px/1.4 var(--font-sans); color: var(--block); margin-bottom: 6px;
    }
    .bubble .md-body .mermaid-error-src {
      margin: 0; padding: 8px 10px; background: var(--paper-2);
      border-radius: 6px; font-size: 12px; line-height: 1.5;
      font-family: var(--font-mono, monospace); color: var(--muted);
      white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow: auto;
    }
    .msg .role-tag {
      font-size: 11px;
      color: var(--muted-2);
      margin-bottom: 4px;
      font-weight: 500;
    }
    .msg.user .role-tag { text-align: right; }
    .msg-thinking .bubble { color: var(--muted); font-style: italic; }
    .msg-error .bubble { background: rgba(239,68,68,0.1); color: var(--block); border-color: rgba(239,68,68,0.3); }

    .input-area {
      border-top: 1px solid var(--glass-line);
      padding: var(--s-16) var(--s-32);
      background: var(--glass-fill-soft);
    }
    .input-row {
      display: flex;
      gap: var(--s-12);
      align-items: flex-end;
      max-width: 860px;
      margin: 0 auto;
    }
    .input-row textarea {
      flex: 1;
      padding: 12px var(--s-16);
      border: 1px solid var(--glass-line-strong);
      border-radius: 10px;
      background: var(--glass-fill);
      color: var(--ink);
      font: 400 14px/1.6 var(--font-sans);
      resize: none;
      outline: none;
      min-height: 48px;
      max-height: 160px;
    }
    .input-row textarea:focus { border-color: var(--led); }
    .input-row button {
      padding: 12px var(--s-20);
      border: none;
      border-radius: 10px;
      font: 500 14px/1 var(--font-sans);
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .send-btn { background: var(--led); color: #fff; }
    .send-btn:hover { background: #4338ca; }
    .send-btn:disabled { background: var(--muted-2); cursor: not-allowed; }
    .stop-btn { background: var(--block); color: #fff; }
    .stop-btn:hover { background: #dc2626; }
    .empty-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      font-size: 15px;
    }
    .token-info {
      font-size: 11px;
      color: var(--muted-2);
      margin-top: 4px;
      text-align: right;
    }

    /* ── 加号工具菜单 / 附件 chip / 选择器 ── */
    .composer { max-width: 860px; margin: 0 auto; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .chip-row:empty { display: none; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      background: var(--glass-fill);
      border: 1px solid var(--glass-line-strong);
      border-radius: 8px;
      font: 500 12px/1.2 var(--font-sans);
      color: var(--ink);
      max-width: 240px;
    }
    .chip img { width: 26px; height: 26px; object-fit: cover; border-radius: 5px; display: block; }
    .chip .chip-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chip .chip-tag { color: var(--muted-2); font-size: 11px; }
    .chip .chip-x {
      background: none; border: none; cursor: pointer; color: var(--muted-2);
      font-size: 14px; line-height: 1; padding: 0 2px;
    }
    .chip .chip-x:hover { color: var(--block); }
    .add-wrap { position: relative; flex-shrink: 0; }
    .add-btn {
      width: 44px; height: 44px; padding: 0;
      border: 1px solid var(--glass-line-strong);
      border-radius: 10px;
      background: var(--glass-fill);
      color: var(--ink);
      font: 400 22px/1 var(--font-sans);
      cursor: pointer;
    }
    .add-btn:hover { border-color: var(--led); color: var(--led); }
    .add-menu {
      position: absolute; left: 0; bottom: 52px; z-index: 20;
      min-width: 148px;
      background: var(--paper); border: 1px solid var(--glass-line-strong);
      border-radius: 10px; box-shadow: 0 6px 20px rgba(15,23,42,.14);
      padding: 6px; display: flex; flex-direction: column; gap: 2px;
    }
    .add-menu[hidden] { display: none; }
    .add-item {
      text-align: left; background: none; border: none; cursor: pointer;
      padding: 9px 10px; border-radius: 7px;
      font: 500 13px/1 var(--font-sans); color: var(--ink);
    }
    .add-item:hover { background: var(--led-soft); color: var(--led); }

    .picker {
      position: fixed; inset: 0; z-index: 60;
      background: rgba(15,23,42,.34);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .picker[hidden] { display: none; }
    .picker-card {
      width: 100%; max-width: 520px; max-height: 72vh;
      background: var(--paper); border-radius: 14px;
      border: 1px solid var(--glass-line-strong);
      box-shadow: 0 20px 48px rgba(15,23,42,.28);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .picker-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; border-bottom: 1px solid var(--glass-line);
      font: 600 14px/1 var(--font-sans); color: var(--ink);
    }
    .picker-close { background: none; border: none; cursor: pointer; font-size: 20px; line-height: 1; color: var(--muted); }
    .picker-close:hover { color: var(--block); }
    .picker-body { overflow-y: auto; padding: 8px; }
    .pick-item {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 12px; border-radius: 9px; cursor: pointer;
    }
    .pick-item:hover { background: var(--led-soft); }
    .pick-item .pi-main { flex: 1; min-width: 0; }
    .pick-item .pi-name { font: 600 13px/1.4 var(--font-sans); color: var(--ink); }
    .pick-item .pi-desc { font: 400 12px/1.5 var(--font-sans); color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .pick-item .pi-meta { font: 400 11px/1 var(--font-mono, monospace); color: var(--muted-2); }
    .picker-empty { padding: 24px; text-align: center; color: var(--muted-2); font-size: 13px; }

    /* 消息流中间的 skill 调用状态行：执行中转圈动画 + 动态文案，结束后静态灰字 */
    .skill-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin: 0 0 var(--s-12);
      text-align: center;
      color: var(--muted-2);
      font: 400 11.5px/1.6 var(--font-sans);
      word-break: break-all;
    }
    .skill-line .sl-text { min-width: 0; }
    .skill-line .sl-spin {
      flex: none;
      width: 11px;
      height: 11px;
      border: 1.6px solid var(--led-soft);
      border-top-color: var(--led);
      border-radius: 50%;
      animation: sl-rotate 0.7s linear infinite;
    }
    .skill-line:not(.is-running) .sl-spin { display: none; }
    @keyframes sl-rotate { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .skill-line .sl-spin { animation-duration: 2.4s; }
    }

    /* AI 产出文件卡片：点整张卡或右侧下载图标都能直接下载 */
    .file-cards {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
      max-width: 420px;
    }
    .file-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: var(--glass-fill);
      border: 1px solid var(--glass-line);
      border-radius: 10px;
      text-decoration: none;
      color: var(--ink);
      transition: border-color 0.12s, background 0.12s;
    }
    .file-card:hover { border-color: var(--led); background: var(--led-soft); }
    .file-card .fc-ico { flex: none; display: inline-flex; color: var(--led); }
    .file-card .fc-name {
      flex: 1;
      min-width: 0;
      font: 500 12.5px/1.4 var(--font-sans);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-card .fc-size { flex: none; color: var(--muted-2); font: 400 11px/1 var(--font-mono, monospace); }
    .file-card .fc-dl { flex: none; display: inline-flex; padding: 4px; border-radius: 6px; color: var(--muted); }
    .file-card:hover .fc-dl { color: var(--led); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1 class="brand-title">
        <span class="tt-pipeline">管线</span>
        <span class="tt-sep">/</span>
        <span class="tt-repo">对话</span>
        <span class="tt-sep">/</span>
        <span class="tt-page">chat</span>
      </h1>
    </div>
    <div class="top-right">
      <a class="nav-link" href="/home">首页</a>
      <a class="nav-link" href="/pipeline" target="_blank" rel="noopener">AI 管线</a>
      <a class="nav-link" href="/tickets" target="_blank" rel="noopener">工单</a>
      <a class="nav-link" href="/kb" target="_blank" rel="noopener">知识库</a>
      <a class="nav-link" href="/reviews" target="_blank" rel="noopener">代码评审</a>

      <a class="nav-link active" href="/chat">AI 对话</a>
      <div class="user-menu">
        <span class="user-chip" id="userChip" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false"><span class="avatar" aria-hidden="true"></span><span id="userName">未登录</span></span>
        <div class="user-panel" id="userPanel" hidden>
          <div class="user-panel-head">
            <span class="avatar" aria-hidden="true"></span>
            <div class="user-panel-meta">
              <strong id="userPanelName">未登录</strong>
              <span class="user-panel-email" id="userPanelEmail"></span>
            </div>
          </div>
          <div class="user-panel-sep"></div>
          <a class="user-panel-item" href="/account"><span class="user-panel-ico" aria-hidden="true">⚙</span>设置</a>
          <div class="user-panel-sep"></div>
          <button class="user-panel-item user-panel-logout" type="button"><span class="user-panel-ico" aria-hidden="true">⏻</span>退出登录</button>
    </div>
  </header>

  <div class="chat-layout">
    <aside class="chat-sidebar">
      <div class="sidebar-head">
        <span class="sidebar-title">对话会话</span>
      </div>
      <button type="button" class="new-chat-btn" id="newChatBtn">+ 新建会话</button>
      <div class="session-list" id="sessionList"></div>
      <div class="model-bar">
        <label for="modelSelect">模型</label>
        <select id="modelSelect"></select>
      </div>
    </aside>

    <main class="chat-main">
      <div class="messages" id="messages">
        <div class="empty-hint">选择或新建一个会话开始对话</div>
      </div>
      <div class="input-area">
        <div class="composer">
          <div class="chip-row" id="chipRow"></div>
          <div class="input-row">
            <div class="add-wrap">
              <button type="button" class="add-btn" id="addBtn" title="添加内容" aria-haspopup="true" aria-expanded="false">+</button>
              <div class="add-menu" id="addMenu" hidden>
                <button type="button" class="add-item" data-act="file">添加文件</button>
                <button type="button" class="add-item" data-act="skill">调用 Skill</button>
                <button type="button" class="add-item" data-act="ref">引用对话</button>
              </div>
            </div>
            <textarea id="msgInput" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）" rows="1"></textarea>
            <button type="button" class="send-btn" id="sendBtn">发送</button>
            <button type="button" class="stop-btn" id="stopBtn" style="display:none;">停止</button>
          </div>
          <input type="file" id="fileInput" multiple hidden
            accept="image/png,image/jpeg,image/gif,image/webp,.txt,.md,.markdown,.json,.jsonl,.csv,.tsv,.log,.env,.js,.mjs,.cjs,.ts,.tsx,.jsx,.vue,.svelte,.py,.java,.go,.rs,.rb,.php,.cs,.c,.h,.cpp,.hpp,.sh,.bash,.zsh,.ps1,.bat,.cmd,.sql,.yaml,.yml,.toml,.ini,.conf,.properties,.html,.htm,.css,.scss,.less,.xml,.svg">
        </div>
      </div>
    </main>
  </div>

  <div class="picker" id="picker" hidden>
    <div class="picker-card">
      <div class="picker-head"><span id="pickerTitle">选择</span><button type="button" class="picker-close" id="pickerClose" aria-label="关闭">×</button></div>
      <div class="picker-body" id="pickerBody"></div>
    </div>
  </div>
</body>
</html>
